[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxisim"
version = "0.1.0"
description = "LLM chemotaxis simulation library for studying gradient navigation"
readme = "README.md"
requires-python = ">=3.10"
# PyTorch: pinned to 2.8.x. For NVIDIA CUDA 12.8 GPU wheels (+cu128), install with the PyTorch index
# so pip resolves the GPU build, e.g.
#   pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cu128
# CPU-only from PyPI works without the extra index. Optional [cuda128] adds torchvision/torchaudio pins.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "transformers>=4.40",
    "torch==2.8.0",
    "accelerate>=0.29",
    "huggingface-hub>=0.22",
    "openai>=1.20",
    "anthropic>=0.25",
    "requests>=2.31",
    "jsonlines>=4.0",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
# Matching CUDA 12.8 stack (install with --extra-index-url https://download.pytorch.org/whl/cu128).
cuda128 = [
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["taxisim*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
